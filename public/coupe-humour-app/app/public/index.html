<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>La Coupe d'Humour - Match 1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  #viewport {
    display:flex;
    justify-content:center;
    align-items:center;
    width:100vw;
    height:100vh;
  }
  #stage {
    position:relative;
    width:1080px;
    height:1920px;
    flex-shrink:0;
    background:#000;
    transform-origin:center center;
  }
  .screen {
    position:absolute;
    top:0; left:0;
    width:1080px;
    height:1920px;
    background-size:cover;
    background-position:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .5s ease;
  }
  .screen.active {
    opacity:1;
    pointer-events:auto;
  }

  #screen-vote { background-image:url('images/bg.png'); }
  #screen-done { background-image:url('images/bg.png'); }

  #cards-area {
    position:absolute;
    left:385px;
    top:390px;
    width:645px;
    height:1225px;
    display:grid;
    grid-template-columns:repeat(2, 204.96px);
    justify-content:center;
    align-content:center;
    gap:34px 40px;
  }

  .card {
    width:204.96px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .card-photo-wrap {
    width:204.96px;
    height:233.75px;
    border-radius:16px;
    overflow:hidden;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    background:rgba(255,255,255,0.03);
    transition:transform .25s ease;
  }

  .card-photo-wrap img {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .card:hover .card-photo-wrap {
    transform:translateY(-4px) scale(1.02);
  }

  .vote-btn {
    margin-top:10px;
    width:167px;
    height:42.9px;
    cursor:pointer;
    border:none;
    background:transparent;
    padding:0;
    transition:transform .15s ease, filter .15s ease;
  }

  .vote-btn img {
    width:100%;
    height:100%;
    display:block;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5));
  }

  .vote-btn:hover img { filter:drop-shadow(0 6px 12px rgba(0,0,0,0.65)) brightness(1.08); }
  .vote-btn:active { transform:scale(0.94); }
  .vote-btn:disabled { opacity:.5; cursor:default; }

  /* Done screen elements */
  .done-el {
    position:absolute;
    opacity:0;
    transform:scale(0.6) translateY(20px);
  }
  #done-text {
    left:504px; top:514px; width:346px; height:63px;
  }
  #done-icon {
    left:592px; top:637px; width:247px; height:247px;
  }
  #done-trophy {
    left:504px; top:977px; width:392px; height:auto;
  }
  .done-el img { width:100%; height:100%; display:block; }
  #done-trophy img { height:auto; }

  #screen-done.active #done-text {
    animation: popIn .55s cubic-bezier(.34,1.56,.64,1) .15s forwards;
  }
  #screen-done.active #done-icon {
    animation: popIn .55s cubic-bezier(.34,1.56,.64,1) .45s forwards;
  }
  #screen-done.active #done-trophy {
    animation: popIn .6s cubic-bezier(.34,1.56,.64,1) .8s forwards;
  }

  @keyframes popIn {
    0%   { opacity:0; transform:scale(0.6) translateY(20px); }
    70%  { opacity:1; transform:scale(1.08) translateY(-4px); }
    100% { opacity:1; transform:scale(1) translateY(0); }
  }
</style>
</head>
<body>

<div id="viewport">
  <div id="stage">

    <div id="screen-vote" class="screen">
      <div id="cards-area">

        <div class="card">
          <div class="card-photo-wrap"><img src="images/Habry-elhabry.png" alt="Abdelhady Elhabry"></div>
          <button class="vote-btn" data-candidate="habry"><img src="images/btn-votez.png" alt="Votez"></button>
        </div>

        <div class="card">
          <div class="card-photo-wrap"><img src="images/Bouabidi-youssef.png" alt="Youssef Bouabidie"></div>
          <button class="vote-btn" data-candidate="bouabidi"><img src="images/btn-votez.png" alt="Votez"></button>
        </div>

        <div class="card">
          <div class="card-photo-wrap"><img src="images/Aziza-noughi.png" alt="Aziza Noughi"></div>
          <button class="vote-btn" data-candidate="aziza"><img src="images/btn-votez.png" alt="Votez"></button>
        </div>

        <div class="card">
          <div class="card-photo-wrap"><img src="images/Monaim-essafoury.png" alt="Abdelmonaim Essafoury"></div>
          <button class="vote-btn" data-candidate="monaim"><img src="images/btn-votez.png" alt="Votez"></button>
        </div>

        <div class="card">
          <div class="card-photo-wrap"><img src="images/Labiad-ayoub.png" alt="Ayoub Elbiad"></div>
          <button class="vote-btn" data-candidate="labiad"><img src="images/btn-votez.png" alt="Votez"></button>
        </div>

        <div class="card">
          <div class="card-photo-wrap"><img src="images/Lmalki-said.png" alt="Said Elmalky"></div>
          <button class="vote-btn" data-candidate="lmalki"><img src="images/btn-votez.png" alt="Votez"></button>
        </div>

        <div class="card">
          <div class="card-photo-wrap"><img src="images/TAZARIN-samir.png" alt="Samir Tazarine"></div>
          <button class="vote-btn" data-candidate="tazarin"><img src="images/btn-votez.png" alt="Votez"></button>
        </div>

        <div class="card">
          <div class="card-photo-wrap"><img src="images/addoul-anas.png" alt="Anas Addoul"></div>
          <button class="vote-btn" data-candidate="addoul"><img src="images/btn-votez.png" alt="Votez"></button>
        </div>

      </div>
    </div>

    <div id="screen-done" class="screen">
      <div id="done-text" class="done-el"><img src="images/DONE.png" alt="Done"></div>
      <div id="done-icon" class="done-el"><img src="images/DONE-icon.png" alt="Check"></div>
      <div id="done-trophy" class="done-el"><img src="images/Trophy.png" alt="Trophy"></div>
    </div>

  </div>
</div>

<script>
  function fitStage() {
    var baseW = 1080, baseH = 1920;
    var scale = Math.min(window.innerWidth / baseW, window.innerHeight / baseH);
    document.getElementById('stage').style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  function showDone() {
    document.getElementById('screen-vote').classList.remove('active');
    document.getElementById('screen-done').classList.add('active');
  }

  function showVote() {
    document.getElementById('screen-done').classList.remove('active');
    document.getElementById('screen-vote').classList.add('active');
  }

  function setButtonsDisabled(disabled) {
    document.querySelectorAll('.vote-btn').forEach(function (btn) {
      btn.disabled = disabled;
    });
  }

  async function vote(candidate) {
    setButtonsDisabled(true);
    try {
      const res = await fetch('/api/vote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ candidate: candidate }),
      });
      if (res.ok || res.status === 409) {
        // Either the vote went through, or the server already had one on
        // record for this browser - either way, show the done screen.
        showDone();
      } else {
        setButtonsDisabled(false);
        alert("Une erreur est survenue, merci de réessayer.");
      }
    } catch (e) {
      setButtonsDisabled(false);
      alert("Impossible de contacter le serveur. Vérifiez votre connexion.");
    }
  }

  document.querySelectorAll('.vote-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      vote(btn.getAttribute('data-candidate'));
    });
  });

  // On load, ask the server (source of truth) whether this visitor already voted.
  (async function init() {
    try {
      const res = await fetch('/api/check');
      const data = await res.json();
      if (data.voted) {
        showDone();
      } else {
        showVote();
      }
    } catch (e) {
      // If the API is unreachable, fall back to showing the vote screen.
      showVote();
    }
  })();
</script>

</body>
</html>
