# nginx site config for canmatchy.com
# Install: copy to /etc/nginx/sites-available/canmatchy.com,
# symlink into sites-enabled, then run certbot (see docs/deployment.md).
#
# The app container binds to 127.0.0.1:3000 (see docker-compose.prod.yml) —
# nginx is the only thing exposed to the internet on 80/443.

# HTTP: certbot will rewrite this block to redirect to HTTPS once the
# certificate is issued (via --nginx). Left plain here for the first run.
server {
    listen 80;
    listen [::]:80;
    server_name canmatchy.com www.canmatchy.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        # SSE (/api/stream/*) requires unbuffered, long-lived connections.
        # These apply harmlessly to normal requests too, so one location
        # block covers both instead of splitting SSE into its own path.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
